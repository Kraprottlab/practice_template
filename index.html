<!DOCTYPE html> <!--このファイルがHTML文書であることの宣言--!>
<html lang="ja"> <!--HTMLタグ。中身がHTML文書であることを示す。lang="ja"で日本語であることを示す--!>
 <head> <!--headはHTML文書の設定を記述するところ。Webっページ内には表示されない。Webページの概要、文字コード、キーワードといったメタワードを定義。検索エンジンやブラウザに伝える。文書のタイトルを指定。外部ファイル読み込み、CSSを直接記述--!>
   <link rel="stylesheet"href="style.css" />
   <title>practice_template</title> <!--ブラウザのタグになるサイトのタイトル--!>
   <meta charset="UTF-8"> <!--文字の表示方法。基本はUTF-8--!>
   <meta name="viewpoint" content="width=device-width, initial-scale=1.0"> <!--name 要素に名前を付与することでメタデータの種類を定義し、内容をcontent属性で表す。レスポンシブ対応とはWebサイトやアプリがユーザーのデバイスに応じて自動的にレイアウトや表示を最適化する技術とは。width=device-widthでデバイス画面幅にページ幅を合わせる。initial-scale=1.0で初期表示のズーム倍率を等倍に設定。--!>
   <meta name="discliption" vontent="HTML文書の書き方を理解するための文書です。"> <!--description 文書の概要を記述する。検索エンジンのクローラーに読み取られ、検索結果などにも表示される情報。１つの文書に1つだけ記述できる。Firefox や Opera など一部のブラウザーは、ページをブックマークに追加した際の既定の説明文としても表示される。--!>
 </head>
  
 <body> <!--ブラウザに表示されるすべてのコンテンツを書くための領域。タグを使ってコンテンツの種類を指定したり、設定やリンクを追加したりできる。--!>
   <header>
     <h1>practice_template</h1>
     <nav>
       <ul>
         <li><a href="#home">ホーム</a></li>
         <li><a href="#about">概要</a></li>
       </ul>
     </nav>
   </header>

   <main>
     <section>
       <h2>練習中</h2>

       <article>
         <h3>練習内容</h3>
         <p><span>figma</span>で感覚的なホームページのデザインを。<span>GitHub</span>で実際にコードを打ち込む。</p>
       </article>
     </section>

     <aside>
       <h2>プロフィール</h2>
       <p>くらっぷろっと</p>
       <p>Webデザインを勉強中。20260618~</p>
     </aside>
   </main>

   <footer>
     <p>&copy; 2026 practice template</p>
   </footer>
 </body>
</html>
